<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Holiday Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="shortcut icon" href="icon-512.png" type="image/x-icon">
  <link rel="icon" href="icon-512.png" type="image/x-icon">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, sans-serif;
      background: #0f172a;
      color: white;
    }

    #splash {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-size: 24px;
      transition: opacity 0.4s ease;
    }

    #splash.hide {
      opacity: 0;
      pointer-events: none;
    }

    #offline-banner {
      position: fixed;
      top: 0;
      width: 100%;
      background: #f87171;
      text-align: center;
      padding: 8px;
      display: none;
      z-index: 9998;
    }

    .container {
      padding: 20px;
      padding-bottom: 80px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 16px;
      backdrop-filter: blur(12px);
    }

    .bar {
      height: 8px;
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: #38bdf8;
    }

    .navbar {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      background: #020617;
    }

    .nav-btn {
      flex: 1;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      color: #94a3b8;
    }

    .nav-btn.active {
      color: white;
    }

    button, input, select {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      border: none;
    }

    .error {
      color: #f87171;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div id="splash">🌴 Holiday Tracker</div>
<div id="offline-banner">⚠️ You are offline</div>

<div id="overview" class="container"></div>
<div id="payments" class="container" style="display:none"></div>

<div class="navbar">
  <div class="nav-btn active" onclick="switchTab('overview', this)">Overview</div>
  <div class="nav-btn" onclick="switchTab('payments', this)">Payments</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "paymenttracker-5a3ec.firebaseapp.com",
  databaseURL: "https://paymenttracker-5a3ec-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "paymenttracker-5a3ec",
  storageBucket: "paymenttracker-5a3ec.firebasestorage.app",
  messagingSenderId: "174924063753",
  appId: "1:174924063753:web:9436cbe9b3446c56dec4d8"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const peopleRef = ref(db, "people");
const paymentsRef = ref(db, "payments");

function switchTab(tab, el) {
  overview.style.display = tab === 'overview' ? 'block' : 'none';
  payments.style.display = tab === 'payments' ? 'block' : 'none';
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}
window.switchTab = switchTab;

function showError(msg) {
  const el = document.getElementById("error");
  if (!el) return;
  el.innerText = msg;
  setTimeout(() => el.innerText = "", 2500);
}

// Splash
window.addEventListener("load", () => {
  setTimeout(() => {
    splash.classList.add("hide");
    setTimeout(() => splash.remove(), 400);
  }, 600);
});

// Offline banner
function updateOnlineStatus() {
  const offlineBanner = document.getElementById("offline-banner");
  offlineBanner.style.display = navigator.onLine ? "none" : "block";
}
window.addEventListener("online", updateOnlineStatus);
window.addEventListener("offline", updateOnlineStatus);
updateOnlineStatus();

// Overview
onValue(peopleRef, snap => {
  const data = snap.val();
  let total = 0, paid = 0;

  Object.values(data).forEach(p => {
    total += p.total;
    paid += p.paid;
  });

  let html = `<div class="card">
    <h2>Holiday Overview</h2>
    <p>Total: £${total.toFixed(2)}</p>
    <p>Remaining: £${(total-paid).toFixed(2)}</p>
  </div>`;

  Object.keys(data).forEach(name => {
    const p = data[name];
    html += `<div class="card">
      <h3>${name}</h3>
      <p>£${p.paid} paid / £${p.total} total.  Remaining Balance: {p.total - p.paid}</p>
      <div class="bar"><div class="fill" style="width:${(p.paid/p.total)*100}%"></div></div>
    </div>`;
  });

  overview.innerHTML = html;
});

// Payments
onValue(paymentsRef, snap => {
  const data = snap.val();

  let html = `
  <div class="card">
    <h2>Make a Payment</h2>
    <select id="person"></select>
    <input id="amount" placeholder="Amount">
    <div id="error" class="error"></div>
    <button onclick="payWithMonzo()">Pay with Monzo</button>
  </div>

  <div class="card"><h2>History</h2>`;

  if (data) {
    Object.values(data).reverse().forEach(p => {
      html += `<p>${p.name} paid £${p.amount} (${new Date(p.date).toLocaleString()})</p>`;
    });
  }

  html += "</div>";
  payments.innerHTML = html;

  onValue(peopleRef, s => {
    const select = document.getElementById("person");
    select.innerHTML = "";
    Object.keys(s.val()).forEach(n => {
      select.innerHTML += `<option>${n}</option>`;
    });
  }, {onlyOnce:true});
});

window.payWithMonzo = function () {
  const name = document.getElementById('person').value;
  let input = document.getElementById('amount');
  let amount = input.value.trim();

  if (!amount || isNaN(amount) || Number(amount) <= 0) {
    showError("Enter valid amount");
    input.style.border = "2px solid red";
    return;
  }

  amount = parseFloat(amount);

  push(paymentsRef, { name, amount, date: new Date().toISOString() });

  const personRef = ref(db, "people/" + name);
  onValue(personRef, snap => {
    const current = snap.val();
    current.paid += amount;
    set(personRef, current);
  }, { onlyOnce: true });

  window.open(`https://monzo.me/louiseallan1/${amount.toFixed(2)}`, "_blank");

  input.value = "";
  input.style.border = "none";
};

// Register SW
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
